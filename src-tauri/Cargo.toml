[package]
name = "voxquest"
version = "0.1.0"
description = "Sovereign native system-wide voice typing utility"
authors = ["VoxQuest Autonomous Engineering"]
edition = "2021"

[lib]
name = "voxquest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.9.0"
rdev = "0.5.3"
cpal = "0.18.2"
arboard = "3.7.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
sha2 = "0.11.1"
rubato = "5.0.1"
tokio = { version = "1.54.1", features = ["full"] }
dirs = "7.0.0"
whisper-rs = { version = "0.16.0", features = ["metal"] }
tauri-plugin-global-shortcut = "2"
hound = "3.5.1"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.22"
objc = "0.2.7"
core-graphics = "0.25"
core-foundation = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
