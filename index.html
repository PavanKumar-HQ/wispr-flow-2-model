<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mascot.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxQuest — Sovereign Voice Typing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html.pill-window, html.pill-window body, body.pill-window, body.pill-window #root {
        background: transparent !important;
        background-color: transparent !important;
      }
    </style>
    <script>
      (function() {
        try {
          var isPill = window.location.hash.includes('pill');
          if (isPill) {
            document.documentElement.classList.add('pill-window');
            document.documentElement.style.setProperty('background', 'transparent', 'important');
            document.documentElement.style.setProperty('background-color', 'transparent', 'important');
            window.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('pill-window');
              document.body.style.setProperty('background', 'transparent', 'important');
              document.body.style.setProperty('background-color', 'transparent', 'important');
            });
          }

          var storedTheme = localStorage.getItem('voxquest_theme');
          var isDark = false;
          if (storedTheme === 'dark_teal') {
            isDark = true;
          } else if (storedTheme === 'light') {
            isDark = false;
          } else if (storedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            // Default to light theme for a pristine initial appearance
            isDark = false;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark_teal');
            if (!isPill && document.body) {
              document.body.style.backgroundColor = '#042D2A';
              document.body.style.color = '#DFDFD4';
            }
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            if (!isPill && document.body) {
              document.body.style.backgroundColor = '#DFDFD4';
              document.body.style.color = '#212121';
            }
          }
        } catch (e) {
          console.warn('Theme bootloader error:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-vq-cream text-vq-charcoal antialiased selection:bg-vq-amber selection:text-vq-charcoal">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
